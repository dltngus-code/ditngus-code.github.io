<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link href="css/main.css" rel="stylesheet">
</head>

<body>

    <div class="cart-background">
        <h3 class="cart-text">Your shopping cart</h3>
        <div class="cart-chart">
            <div>
                <table class="cart-table">
                    <tr>
                        <th class="cart-subtext">ITEM</th>
                        <th class="cart-subtext">AMOUNT</th>
                        <th class="cart-subtext">PRICE</th>
                        <th class="cart-subtext">TOTAL</th>
                    </tr>
                    <tr>
                        <td>
                            <img src="img/sony%20fe.jfif" class="cart-img">
                            SONY
                            <span class="cart-subtext2">FE 70-200mm F2.8 GM OSS</span>
                        </td>
                        <td class="cart-subtext">1</td>
                        <td class="cart-subtext">$ 1979.00</td>
                        <td class="cart-txt">$ 1979.00</td>
                    </tr>
                    <tr>
                        <td>
                            <img src="img/sony%2024mm.jfif" class="cart-img">
                            SONY
                            <span class="cart-subtext2">sonnar T* E 24mm F1.8 ZA</span>
                        </td>
                        <td class="cart-subtext">1</td>
                        <td class="cart-subtext">$ 989.00</td>
                        <td class="cart-txt">$ 989.00</td>
                    </tr>
                    <tr>
                        <td colspan="3"></td>
                        <td class="cart-txt">$ 2968.00</td>
                    </tr>
                </table>
            </div>
        </div>
        <div>
            <a href="#" class="cart-textsize">Edit your shopping cart</a>
            <button class="cart-button">choose payment method</button>
        </div>
    </div>


</body>

</html>
